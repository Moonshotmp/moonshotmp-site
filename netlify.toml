[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm ci"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Increase request body limit for logo uploads (default is 1MB, max is 6MB)
[functions."partner-save"]
  requestBody = { maxSize = 6291456 }  # 6MB

[functions."partner-update"]
  requestBody = { maxSize = 6291456 }  # 6MB

[functions."logo-upload"]
  requestBody = { maxSize = 6291456 }  # 6MB

# Clean partner storefront URLs: /partners/kickhouse → /partners/store.html
# Netlify serves static files first, so /partners/setup.html, /partners/login.html, etc. still work.
# Only unmatched paths (i.e. partner slugs) hit this rewrite.
[[edge_functions]]
  function = "partner-seo"
  path = "/partners/*"

[[edge_functions]]
  function = "leaderboard-share"
  path = "/leaderboard/entry/*"

# Leaderboard API URL — set in Netlify dashboard: LEADERBOARD_API_URL

[[redirects]]
  from = "/partners/:slug"
  to = "/partners/store.html"
  status = 200
