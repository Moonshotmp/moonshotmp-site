[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm ci && npm run build:css"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "partner-seo"
  path = "/partners/*"

[[edge_functions]]
  function = "leaderboard-share"
  path = "/leaderboard/entry/*"

# Leaderboard API URL — set in Netlify dashboard: LEADERBOARD_API_URL

# Redirects (quiz aliases, partner storefront slugs) live in _redirects (the canonical redirects file
# for this site; netlify.toml is reserved for build/function/edge config).
