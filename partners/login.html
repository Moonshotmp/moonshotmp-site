<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://moonshotmp.com/partners/login.html" />
  <title>Partner Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/partners/styles.css" />
  <style>
    input:not([type="checkbox"]):not([type="file"]) {
      display: block;
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: var(--color-brand-light, #F0EEE9);
      padding: 12px 14px;
      font-size: 16px;
      font-family: var(--font-body, 'Poppins', sans-serif);
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: rgba(255,255,255,0.4);
      outline: none;
    }
    input::placeholder {
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <main class="container" style="max-width:760px;">
    <h1>Partner Login</h1>
    <p class="muted" style="margin-top:-6px;">We'll email you a sign-in link.</p>

    <div class="card" style="padding:1.25rem;">
      <div id="verifyingBox" style="display:none; text-align:center; padding:2rem 0;">
        Verifying sign-in link...
      </div>

      <div id="loginForm">
        <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
          <label style="display:flex; flex-direction:column; gap:6px;">
            Store name
            <input id="slug" placeholder="Your store name" />
          </label>

          <label style="display:flex; flex-direction:column; gap:6px;">
            Email
            <input id="email" type="email" placeholder="you@company.com" />
          </label>
        </div>

        <div style="display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap;">
          <button type="button" class="btn-primary" id="sendLink">
            <span style="display:inline-flex; align-items:center; gap:10px; justify-content:center;">
              <span id="sendLabel">Email sign-in link</span>
            </span>
          </button>
          <a class="btn-outline" id="backToStore" href="/partners/">Back to store</a>
        </div>

        <div class="muted" style="font-size:13px; margin-top:10px;">
          If the email matches your partner account, you'll receive a sign-in link.
        </div>
      </div>

      <pre id="status" style="white-space:pre-wrap;margin-top:14px;"></pre>
    </div>
  </main>

<script src="/partners/api.js"></script>
<script>
  const qs = new URL(window.location.href).searchParams;
  const slugEl = document.getElementById("slug");
  const emailEl = document.getElementById("email");
  const sendBtn = document.getElementById("sendLink");
  const sendLabel = document.getElementById("sendLabel");
  const statusEl = document.getElementById("status");
  const backToStore = document.getElementById("backToStore");
  const loginForm = document.getElementById("loginForm");
  const verifyingBox = document.getElementById("verifyingBox");

  // If already logged in, go straight to manage
  if (PartnerAPI.isLoggedIn() && !qs.get("token")) {
    window.location.href = "/partners/manage.html";
  }

  // Handle magic link token verification
  const tokenParam = qs.get("token");
  if (tokenParam) {
    loginForm.style.display = "none";
    verifyingBox.style.display = "block";

    (async () => {
      try {
        const res = await PartnerAPI.apiPost("/api/partners/auth/verify", { token: tokenParam }, { skipAuthRedirect: true });
        const data = await res.json();

        if (!res.ok) {
          statusEl.textContent = data.error || "Invalid or expired link. Request a new one.";
          verifyingBox.style.display = "none";
          loginForm.style.display = "block";
          return;
        }

        PartnerAPI.setToken(data.token);
        const slug = data.partner?.slug || "";
        window.location.href = `/partners/manage.html${slug ? "?slug=" + encodeURIComponent(slug) : ""}`;
      } catch (err) {
        statusEl.textContent = "Verification failed. Please request a new sign-in link.";
        verifyingBox.style.display = "none";
        loginForm.style.display = "block";
      }
    })();
  }

  // Prefill slug
  const slugPrefill = (qs.get("slug") || "").trim().toLowerCase();
  if (slugPrefill) slugEl.value = slugPrefill;
  if (slugPrefill) backToStore.href = `/partners/${encodeURIComponent(slugPrefill)}`;

  const EMAIL_KEY = "ms_partner_last_email";
  const rememberedEmail = (localStorage.getItem(EMAIL_KEY) || "").trim();
  if (!emailEl.value && rememberedEmail) emailEl.value = rememberedEmail;
  if (!tokenParam) setTimeout(() => { try { emailEl.focus(); emailEl.select(); } catch {} }, 50);

  emailEl.addEventListener("input", () => localStorage.setItem(EMAIL_KEY, (emailEl.value || "").trim()));

  let sending = false;
  async function requestLink() {
    if (sending) return;
    statusEl.textContent = "";

    const slug = (slugEl.value || "").trim().toLowerCase();
    const email = (emailEl.value || "").trim();
    if (!slug || !email) {
      statusEl.textContent = "Enter your store name and email.";
      return;
    }

    sending = true;
    sendBtn.disabled = true;
    sendLabel.textContent = "Sending…";

    try {
      const res = await PartnerAPI.apiPost("/api/partners/auth/request", { slug, email }, { skipAuthRedirect: true });
      const data = await res.json();

      localStorage.setItem(EMAIL_KEY, email);

      if (!res.ok) {
        statusEl.textContent = data.error || data.message || "Request failed";
        return;
      }

      statusEl.textContent = "If the email matches the store owner email, you'll receive a sign-in link.";
    } finally {
      sending = false;
      sendBtn.disabled = false;
      sendLabel.textContent = "Email sign-in link";
    }
  }

  sendBtn.addEventListener("click", requestLink);
  function submitIfEnter(e){ if (e.key === "Enter") { e.preventDefault(); requestLink(); } }
  slugEl.addEventListener("keydown", submitIfEnter);
  emailEl.addEventListener("keydown", submitIfEnter);
</script>
</body>
</html>
