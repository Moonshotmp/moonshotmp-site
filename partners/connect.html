<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://moonshotmp.com/partners/connect.html" />
  <title>Connect Stripe</title>
  <link rel="stylesheet" href="/partners/styles.css" />
</head>
<body>
  <section class="section section-dark bg-texture">
    <div class="container" style="max-width: 720px;">
      <h1>Connect Stripe</h1>
      <p class="lead">Next step: connect your Stripe account so you can accept payments from your storefront.</p>

      <div class="card" style="padding: 1.5rem;">
        <div class="muted">Partner slug</div>
        <div id="slug" style="margin-bottom: 1rem; font-family: var(--font-heading); letter-spacing: 0.05em;"></div>

        <div id="stripe-badge" class="badge" style="display:none; margin-bottom: 1rem;"></div>

        <div style="display:flex; gap:10px; align-items:center; flex-wrap: wrap; margin-top: 1rem;">
          <button id="connect" class="btn-primary" type="button">Connect Stripe</button>
          <a id="billing" class="btn-primary" href="#" style="display:none;">Set Up Billing</a>
          <a id="store" class="btn-outline" href="#" style="display:none;">View Store</a>
        </div>

        <pre id="status" style="white-space:pre-wrap;margin-top:16px;"></pre>
      </div>
    </div>
  </section>

  <script src="/partners/api.js"></script>
  <script>
    const slugEl = document.getElementById("slug");
    const statusEl = document.getElementById("status");
    const storeEl = document.getElementById("store");
    const billingEl = document.getElementById("billing");
    const connectBtn = document.getElementById("connect");
    const badgeEl = document.getElementById("stripe-badge");

    function setStatus(msg) { statusEl.textContent = msg; }
    function showBadge(text) { badgeEl.textContent = text; badgeEl.style.display = "inline-flex"; }

    function getSlug() {
      const url = new URL(window.location.href);
      return (url.searchParams.get("slug") || "").trim().toLowerCase();
    }

    async function loadConnectStatus(slug) {
      const res = await PartnerAPI.apiGet(`/api/partners/connect/status/${encodeURIComponent(slug)}`, { skipAuthRedirect: true });
      if (!res.ok) throw new Error("Failed to load partner status");
      return await res.json();
    }

    function setConnectMode({ connected, onboarded, hasBilling }) {
      billingEl.style.display = "none";

      if (!connected) {
        showBadge("Stripe: not connected");
        connectBtn.textContent = "Connect Stripe";
        connectBtn.style.display = "inline-block";
        return;
      }

      if (onboarded) {
        showBadge("Stripe: connected");
        connectBtn.style.display = "none";

        if (hasBilling) {
          setStatus("Setup complete! Your store is ready to accept orders.");
        } else {
          billingEl.style.display = "inline-flex";
          setStatus("Stripe is connected. Next: set up billing for wholesale costs.");
        }
        return;
      }

      showBadge("Stripe: setup incomplete");
      connectBtn.textContent = "Finish Stripe Setup";
      connectBtn.style.display = "inline-block";
      setStatus("Stripe is connected, but onboarding is not complete. Click to finish setup.");
    }

    const slug = getSlug();

    (async () => {
      if (!slug) {
        slugEl.textContent = "(missing)";
        setStatus("Missing slug. Go back to /partners/setup.html to create your store first.");
        connectBtn.disabled = true;
        return;
      }

      slugEl.textContent = slug;
      storeEl.href = `/partners/store.html?slug=${encodeURIComponent(slug)}`;
      storeEl.style.display = "inline-flex";
      billingEl.href = `/partners/billing.html?slug=${encodeURIComponent(slug)}`;

      try {
        const data = await loadConnectStatus(slug);
        setConnectMode({ connected: data.connected, onboarded: data.onboarded, hasBilling: data.hasBilling });
      } catch (err) {
        setStatus(err?.message || String(err));
      }
    })();

    connectBtn.addEventListener("click", async () => {
      if (!slug) return;

      // If logged in, use the authenticated connect endpoint
      if (PartnerAPI.isLoggedIn()) {
        try {
          connectBtn.disabled = true;
          connectBtn.textContent = "Redirecting to Stripe...";
          const res = await PartnerAPI.apiPost("/api/partners/me/connect", {});
          const data = await res.json();
          if (data.url) {
            window.location.href = data.url;
          } else {
            setStatus("Failed to start Stripe Connect");
            connectBtn.disabled = false;
            connectBtn.textContent = "Connect Stripe";
          }
        } catch (err) {
          setStatus("Error: " + err.message);
          connectBtn.disabled = false;
          connectBtn.textContent = "Connect Stripe";
        }
      } else {
        // Not logged in — redirect to login first
        window.location.href = `/partners/login.html?slug=${encodeURIComponent(slug)}`;
      }
    });

    // If coming back from Stripe, re-check partner status
    window.addEventListener("focus", async () => {
      if (!slug) return;
      try {
        const data = await loadConnectStatus(slug);
        setConnectMode({ connected: data.connected, onboarded: data.onboarded, hasBilling: data.hasBilling });
      } catch {}
    });
  </script>
</body>
</html>
